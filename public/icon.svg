<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#141210" />
      <stop offset="100%" stop-color="#0a0a09" />
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Sound Pulse Wave -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.15" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.25" />

  <!-- Center Glow -->
  <circle cx="256" cy="256" r="110" fill="#f59e0b" fill-opacity="0.08" />

  <!-- Headphones Arc -->
  <path d="M 148 260 A 108 108 0 0 1 364 260" fill="none" stroke="url(#amberGold)" stroke-width="24" stroke-linecap="round" filter="url(#shadow)" />

  <!-- Headband inner cushion -->
  <path d="M 172 230 A 88 88 0 0 1 340 230" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- Ear cups -->
  <!-- Left Ear Cup -->
  <rect x="120" y="240" width="36" height="74" rx="18" fill="url(#amberGold)" filter="url(#shadow)" />
  <rect x="138" y="248" width="12" height="58" rx="6" fill="#1c1917" />
  <line x1="148" y1="210" x2="148" y2="245" stroke="url(#amberGold)" stroke-width="12" stroke-linecap="round" />

  <!-- Right Ear Cup -->
  <rect x="356" y="240" width="36" height="74" rx="18" fill="url(#amberGold)" filter="url(#shadow)" />
  <rect x="362" y="248" width="12" height="58" rx="6" fill="#1c1917" />
  <line x1="364" y1="210" x2="364" y2="245" stroke="url(#amberGold)" stroke-width="12" stroke-linecap="round" />

  <!-- Center Audio Waveform Visualizer Bars -->
  <g fill="url(#amberGold)">
    <rect x="206" y="246" width="8" height="28" rx="4" opacity="0.75" />
    <rect x="222" y="232" width="8" height="56" rx="4" opacity="0.9" />
    <rect x="238" y="218" width="8" height="84" rx="4" />
    <rect x="254" y="205" width="8" height="110" rx="4" />
    <rect x="270" y="222" width="8" height="76" rx="4" />
    <rect x="286" y="236" width="8" height="48" rx="4" opacity="0.9" />
    <rect x="302" y="248" width="8" height="24" rx="4" opacity="0.7" />
  </g>

  <!-- Microphone Boom Arm -->
  <path d="M 136 300 C 136 360, 200 375, 235 365" fill="none" stroke="url(#amberGold)" stroke-width="10" stroke-linecap="round" />
  <!-- Mic Capsule -->
  <circle cx="245" cy="362" r="14" fill="#fef08a" filter="url(#shadow)" />
  <circle cx="245" cy="362" r="8" fill="#d97706" />
</svg>
